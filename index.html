<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }

<script>

const W = window.innerWidth, H = window.innerHeight;
const bgCanvas = document.getElementById('bg');
const mainCanvas = document.getElementById('main');
const moonCanvas = document.getElementById('moon-canvas');
bgCanvas.width = mainCanvas.width = moonCanvas.width = W;
bgCanvas.height = mainCanvas.height = moonCanvas.height = H;
const bgCtx = bgCanvas.getContext('2d');
const ctx = mainCanvas.getContext('2d');

// Pan
let panX = 0, panY = 0;
let velX = 0, velY = 0;
let isDragging = false, lastMX = 0, lastMY = 0;
const MAX_PAN = 350;

// Moon world position
const MOON = { ox: 0, oy: -155, r: 64, depth: 0.3 };

// ========================
// THREE.JS MOON SETUP
// ========================
const moonRenderer = new THREE.WebGLRenderer({ canvas: moonCanvas, alpha: true, antialias: true });
moonRenderer.setPixelRatio(window.devicePixelRatio);
moonRenderer.setSize(W, H);
moonRenderer.setClearColor(0x000000, 0);

const moonScene = new THREE.Scene();
const moonCamera = new THREE.PerspectiveCamera(30, W / H, 0.1, 1000);
moonCamera.position.z = 5;

// Generate moon texture procedurally
function generateMoonTexture(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const tc = c.getContext('2d');

  // Base color - realistic lunar grey-white
  const baseGrad = tc.createRadialGradient(size*0.42, size*0.38, 0, size*0.5, size*0.5, size*0.52);
  baseGrad.addColorStop(0, '#f0ede4');
  baseGrad.addColorStop(0.3, '#ddd9ce');
  baseGrad.addColorStop(0.6, '#c4bfb2');
  baseGrad.addColorStop(0.85, '#a8a298');
  baseGrad.addColorStop(1, '#7a766e');
  tc.fillStyle = baseGrad;
  tc.fillRect(0, 0, size, size);

  // Mare (dark seas) - realistic positions
  const mares = [
    {x:0.38,y:0.32,rx:0.19,ry:0.14,a:0.38,rot:0.2},   // Mare Imbrium
    {x:0.55,y:0.38,rx:0.14,ry:0.10,a:0.32,rot:-0.1},  // Mare Serenitatis
    {x:0.60,y:0.50,rx:0.13,ry:0.09,a:0.30,rot:0.15},  // Mare Tranquillitatis
    {x:0.48,y:0.52,rx:0.10,ry:0.08,a:0.28,rot:0.0},   // Mare Vaporum
    {x:0.30,y:0.48,rx:0.12,ry:0.08,a:0.25,rot:0.3},   // Oceanus Procellarum
    {x:0.65,y:0.60,rx:0.09,ry:0.07,a:0.22,rot:-0.2},  // Mare Fecunditatis
    {x:0.40,y:0.62,rx:0.08,ry:0.06,a:0.20,rot:0.1},   // Mare Cognitum
    {x:0.70,y:0.42,rx:0.06,ry:0.05,a:0.18,rot:0.0},   // Mare Crisium
  ];
  mares.forEach(m => {
    tc.save();
    tc.translate(m.x*size, m.y*size);
    tc.rotate(m.rot);
    const g = tc.createRadialGradient(0,0,0, 0,0, m.rx*size);
    g.addColorStop(0, `rgba(68,64,58,${m.a})`);
    g.addColorStop(0.6, `rgba(75,70,63,${m.a*0.6})`);
    g.addColorStop(1, `rgba(80,76,70,0)`);
    tc.scale(1, m.ry/m.rx);
    tc.beginPath(); tc.arc(0, 0, m.rx*size, 0, Math.PI*2);
    tc.fillStyle = g; tc.fill();
    tc.restore();
  });

  // Fine surface texture — noise dots
  for(let i=0;i<8000;i++){
    const x=Math.random()*size, y=Math.random()*size;
    const dist = Math.hypot(x-size/2, y-size/2);
    if(dist > size*0.5) continue;
    const brightness = Math.random()>0.5 ? 1 : -1;
    const alpha = Math.random()*0.06;
    tc.fillStyle = brightness>0 ? `rgba(255,252,245,${alpha})` : `rgba(0,0,0,${alpha})`;
    tc.fillRect(x, y, 1, 1);
  }

  return new THREE.CanvasTexture(c);
}

// Generate bump map for craters
function generateBumpMap(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const tc = c.getContext('2d');
  tc.fillStyle = '#808080';
  tc.fillRect(0,0,size,size);

  // Craters
  const craters = [
    {x:0.62,y:0.28,r:0.055},{x:0.30,y:0.60,r:0.045},{x:0.18,y:0.38,r:0.04},
    {x:0.72,y:0.55,r:0.038},{x:0.50,y:0.20,r:0.032},{x:0.45,y:0.70,r:0.035},
    {x:0.22,y:0.70,r:0.028},{x:0.78,y:0.35,r:0.025},{x:0.60,y:0.68,r:0.03},
    {x:0.35,y:0.25,r:0.022},{x:0.68,y:0.72,r:0.02},{x:0.15,y:0.55,r:0.025},
    {x:0.80,y:0.60,r:0.018},{x:0.55,y:0.80,r:0.022},{x:0.25,y:0.82,r:0.016},
    // Small craters
    {x:0.42,y:0.42,r:0.012},{x:0.58,y:0.44,r:0.014},{x:0.32,y:0.35,r:0.010},
    {x:0.70,y:0.25,r:0.011},{x:0.48,y:0.58,r:0.013},{x:0.20,y:0.28,r:0.009},
    {x:0.82,y:0.45,r:0.010},{x:0.65,y:0.80,r:0.012},{x:0.38,y:0.78,r:0.010},
  ];

  craters.forEach(cr => {
    const cx = cr.x*size, cy = cr.y*size, r = cr.r*size;
    // Crater rim (bright)
    const rim = tc.createRadialGradient(cx,cy,r*0.5, cx,cy,r*1.3);
    rim.addColorStop(0,'rgba(120,120,120,0)');
    rim.addColorStop(0.7,'rgba(200,200,200,0.5)');
    rim.addColorStop(1,'rgba(128,128,128,0)');
    tc.beginPath(); tc.arc(cx,cy,r*1.3,0,Math.PI*2);
    tc.fillStyle=rim; tc.fill();
    // Crater floor (dark)
    const floor = tc.createRadialGradient(cx,cy,0, cx,cy,r);
    floor.addColorStop(0,'rgba(30,30,30,0.7)');
    floor.addColorStop(0.8,'rgba(60,60,60,0.4)');
    floor.addColorStop(1,'rgba(128,128,128,0)');
    tc.beginPath(); tc.arc(cx,cy,r,0,Math.PI*2);
    tc.fillStyle=floor; tc.fill();
  });

  return new THREE.CanvasTexture(c);
}

const moonTexSize = 2048;
const moonTex = generateMoonTexture(moonTexSize);
const bumpTex = generateBumpMap(moonTexSize);

const moonGeo = new THREE.SphereGeometry(1, 128, 128);
const moonMat = new THREE.MeshPhongMaterial({
  map: moonTex,
  bumpMap: bumpTex,
  bumpScale: 0.04,
  shininess: 3,
  specular: new THREE.Color(0x111111),
});
const moonMesh = new THREE.Mesh(moonGeo, moonMat);
moonScene.add(moonMesh);

// Realistic sunlight — slightly warm directional from upper-left
const sunLight = new THREE.DirectionalLight(0xfff5e8, 1.25);
sunLight.position.set(-2.5, 1.8, 2.2);
moonScene.add(sunLight);

// Very faint earthshine fill
const fillLight = new THREE.AmbientLight(0x102040, 0.12);
moonScene.add(fillLight);

// Atmosphere glow
const atmGeo = new THREE.SphereGeometry(1.055, 64, 64);
const atmMat = new THREE.MeshPhongMaterial({
  color: 0xc8d8f0,
  transparent: true,
  opacity: 0.055,
  side: THREE.BackSide,
  depthWrite: false,
});
moonScene.add(new THREE.Mesh(atmGeo, atmMat));

// Moon position in 2D world coords -> Three.js scene coords
function updateMoonPosition() {
  const mx = W/2 + MOON.ox - panX*MOON.depth;
  const my = H/2 + MOON.oy - panY*MOON.depth;
  // Convert canvas pixel coords to NDC
  const ndcX = (mx / W) * 2 - 1;
  const ndcY = -((my / H) * 2 - 1);
  // Project to world pos at z=0
  const fov = moonCamera.fov * Math.PI / 180;
  const dist = moonCamera.position.z;
  const worldH = 2 * Math.tan(fov/2) * dist;
  const worldW = worldH * (W/H);
  moonMesh.position.x = ndcX * worldW/2;
  moonMesh.position.y = ndcY * worldH/2;
  // Scale sphere to match desired pixel radius
  const pixelsPerUnit = H / worldH;
  const scale = MOON.r / pixelsPerUnit;
  moonMesh.scale.setScalar(scale);
  // Slow rotation
  moonMesh.rotation.y += 0.0003;
  moonMesh.rotation.x = 0.07;
}

// ========================
// STAR LAYERS (parallax) — much more realistic
// ========================
const LAYERS = [
  { count:1800, depth:0.06, minR:0.18, maxR:0.55, baseAlpha:0.22 },
  { count:900,  depth:0.15, minR:0.3,  maxR:0.9,  baseAlpha:0.38 },
  { count:380,  depth:0.28, minR:0.5,  maxR:1.4,  baseAlpha:0.52 },
  { count:120,  depth:0.55, minR:0.9,  maxR:2.0,  baseAlpha:0.68 },
];

// Stellar color palette — realistic star colors by spectral type
const starColors = [
  {r:155,g:176,b:255,weight:0.04},  // O/B blue
  {r:170,g:191,b:255,weight:0.06},  // B blue-white
  {r:202,g:215,b:255,weight:0.10},  // A white-blue
  {r:248,g:247,b:255,weight:0.35},  // F/G white
  {r:255,g:244,b:234,weight:0.25},  // G warm white
  {r:255,g:229,b:193,weight:0.12},  // K orange-yellow
  {r:255,g:204,b:148,weight:0.05},  // K orange
  {r:255,g:166,b:81, weight:0.03},  // M orange-red
];

function pickStarColor() {
  let rnd = Math.random(), acc = 0;
  for(const c of starColors){acc+=c.weight;if(rnd<acc)return c;}
  return starColors[4];
}

const layerStars = LAYERS.map(l => {
  const stars = [];
  for(let i=0;i<l.count;i++){
    const col = pickStarColor();
    stars.push({
      ox:(Math.random()-0.5)*(W+MAX_PAN*2/l.depth),
      oy:(Math.random()-0.5)*(H+MAX_PAN*2/l.depth),
      r: l.minR + Math.random()*(l.maxR-l.minR),
      alpha: l.baseAlpha*(0.5+Math.random()*0.5),
      twinkle: Math.random()*Math.PI*2,
      twinkleSpeed: 0.003+Math.random()*0.014,
      twinkleAmp: 0.12+Math.random()*0.35,
      cr:col.r, cg:col.g, cb:col.b,
      hasGlow: Math.random()<0.08,   // 8% get a soft glow halo
      glowColor: col,
    });
  }
  return {...l, stars};
});

// Interactive stars (7 clickable)
const myStars = [
  {ox:-220,oy:-130,size:7},
  {ox:260, oy:-200,size:8.5},
  {ox:-160,oy:140, size:7},
  {ox:200, oy:160, size:8},
  {ox:-310,oy:200, size:7.5},
  {ox:340, oy:190, size:7},
  {ox:40,  oy:260, size:8}
];
const STAR_DEPTH = 0.5;

// ========================
// STATIC BG (nebulae, milky way)
// ========================
function drawNebulae() {
  const blobs = [
    {x:W*0.2, y:H*0.35,rx:320,ry:180,color:'rgba(14,8,52,', a:0.6,rot:0.3},
    {x:W*0.75,y:H*0.25,rx:260,ry:150,color:'rgba(6,18,48,',  a:0.5,rot:-0.2},
    {x:W*0.5, y:H*0.72,rx:380,ry:200,color:'rgba(20,5,45,',  a:0.5,rot:0.1},
    {x:W*0.85,y:H*0.65,rx:220,ry:140,color:'rgba(3,16,40,',  a:0.45,rot:0.5},
    {x:W*0.12,y:H*0.7, rx:180,ry:120,color:'rgba(10,6,38,',  a:0.4,rot:-0.3},
  ];
  blobs.forEach(b=>{
    bgCtx.save();
    bgCtx.translate(b.x,b.y);
    bgCtx.rotate(b.rot);
    const grad=bgCtx.createRadialGradient(0,0,0,0,0,Math.max(b.rx,b.ry));
    grad.addColorStop(0,b.color+b.a+')');
    grad.addColorStop(0.5,b.color+(b.a*0.4)+')');
    grad.addColorStop(1,b.color+'0)');
    bgCtx.scale(b.rx/Math.max(b.rx,b.ry),b.ry/Math.max(b.rx,b.ry));
    bgCtx.beginPath();bgCtx.arc(0,0,Math.max(b.rx,b.ry),0,Math.PI*2);
    bgCtx.fillStyle=grad;bgCtx.fill();
    bgCtx.restore();
  });
}

// Static background
bgCtx.fillStyle='#00010e';
bgCtx.fillRect(0,0,W,H);
// Milky way band
const mw=bgCtx.createLinearGradient(W*0.1,H*0.1,W*0.9,H*0.9);
mw.addColorStop(0,'rgba(0,0,0,0)');
mw.addColorStop(0.25,'rgba(18,16,45,0.07)');
mw.addColorStop(0.5,'rgba(28,22,56,0.13)');
mw.addColorStop(0.75,'rgba(18,16,45,0.07)');
mw.addColorStop(1,'rgba(0,0,0,0)');
bgCtx.fillStyle=mw;bgCtx.fillRect(0,0,W,H);
// Second milky way band perpendicular for density
const mw2=bgCtx.createLinearGradient(W*0.8,H*0.05,W*0.2,H*0.95);
mw2.addColorStop(0,'rgba(0,0,0,0)');
mw2.addColorStop(0.4,'rgba(12,10,35,0.06)');
mw2.addColorStop(0.6,'rgba(12,10,35,0.06)');
mw2.addColorStop(1,'rgba(0,0,0,0)');
bgCtx.fillStyle=mw2;bgCtx.fillRect(0,0,W,H);
drawNebulae();

// ========================
// SHOOTING STARS
// ========================
const shoots=[];
let nextShoot=120;
function spawnShoot(){
  const sx=Math.random()*W*1.2-W*0.1, sy=-20;
  const angle=(12+Math.random()*30)*Math.PI/180;
  const speed=4+Math.random()*5;
  shoots.push({
    x:sx,y:sy,
    vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
    len:80+Math.random()*130,
    life:1,
    width:0.8+Math.random()*0.9,
    bright: 0.7+Math.random()*0.3,
  });
}

// ========================
// WORLD TO SCREEN
// ========================
function w2s(ox,oy,depth){
  return {x:W/2+ox-panX*depth, y:H/2+oy-panY*depth};
}

// ========================
// INTERACTIVE STAR DRAWING
// ========================
let glowT=0;
function drawMyStars(){
  glowT+=0.018;
  myStars.forEach((s,i)=>{
    const {x,y}=w2s(s.ox,s.oy,STAR_DEPTH);
    const pulse=0.75+0.25*Math.sin(glowT+i*1.1);
    const sz=s.size*pulse;

    // Multi-layer glow
    const g1=ctx.createRadialGradient(x,y,0,x,y,sz*6);
    g1.addColorStop(0,`rgba(255,248,200,${(0.32*pulse).toFixed(2)})`);
    g1.addColorStop(0.3,`rgba(255,235,140,${(0.14*pulse).toFixed(2)})`);
    g1.addColorStop(0.6,`rgba(200,180,80,${(0.05*pulse).toFixed(2)})`);
    g1.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g1;ctx.beginPath();ctx.arc(x,y,sz*6,0,Math.PI*2);ctx.fill();

    // 4-spike diffraction spike
    ctx.save();ctx.translate(x,y);
    const spikePulse=`rgba(255,253,225,${pulse.toFixed(2)})`;
    ctx.fillStyle=spikePulse;
    ctx.beginPath();
    for(let k=0;k<8;k++){
      const ang=(k*Math.PI/4)-Math.PI/2;
      const rad=k%2===0?sz:sz*0.28;
      k===0?ctx.moveTo(Math.cos(ang)*rad,Math.sin(ang)*rad):ctx.lineTo(Math.cos(ang)*rad,Math.sin(ang)*rad);
    }
    ctx.closePath();ctx.fill();
    // Diagonal softer spikes
    ctx.save();ctx.rotate(Math.PI/4);
    ctx.globalAlpha=0.4*pulse;
    ctx.beginPath();
    for(let k=0;k<8;k++){
      const ang=(k*Math.PI/4)-Math.PI/2;
      const rad=k%2===0?sz*0.65:sz*0.22;
      k===0?ctx.moveTo(Math.cos(ang)*rad,Math.sin(ang)*rad):ctx.lineTo(Math.cos(ang)*rad,Math.sin(ang)*rad);
    }
    ctx.closePath();ctx.fill();
    ctx.restore();
    // Core
    ctx.globalAlpha=1;
    ctx.fillStyle=`rgba(255,255,255,${pulse.toFixed(2)})`;
    ctx.beginPath();ctx.arc(0,0,sz*0.35,0,Math.PI*2);ctx.fill();
    // Hot center
    ctx.fillStyle=`rgba(220,240,255,${pulse.toFixed(2)})`;
    ctx.beginPath();ctx.arc(0,0,sz*0.15,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

// ========================
// HIT TEST
// ========================
function hitTest(cx,cy){
  const m=w2s(MOON.ox,MOON.oy,MOON.depth);
  if(Math.hypot(cx-m.x,cy-m.y)<MOON.r+10)return{type:'moon'};
  for(let i=0;i<myStars.length;i++){
    const s=myStars[i],p=w2s(s.ox,s.oy,STAR_DEPTH);
    if(Math.hypot(cx-p.x,cy-p.y)<s.size*4)return{type:'star',i};
  }
  return null;
}

// ========================
// INPUT
// ========================
let dragMoved=false;
mainCanvas.addEventListener('mousedown',e=>{isDragging=true;dragMoved=false;lastMX=e.clientX;lastMY=e.clientY;velX=0;velY=0;document.body.classList.add('dragging');});
mainCanvas.addEventListener('touchstart',e=>{isDragging=true;dragMoved=false;lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;velX=0;velY=0;},{passive:true});
window.addEventListener('mousemove',e=>{
  if(isDragging){
    const dx=e.clientX-lastMX,dy=e.clientY-lastMY;
    if(Math.abs(dx)+Math.abs(dy)>3)dragMoved=true;
    panX=Math.max(-MAX_PAN,Math.min(MAX_PAN,panX-dx));
    panY=Math.max(-MAX_PAN,Math.min(MAX_PAN,panY-dy));
    velX=-dx*0.25;velY=-dy*0.25;
    lastMX=e.clientX;lastMY=e.clientY;
  } else {
    const hit=hitTest(e.clientX,e.clientY);
    const tt=document.getElementById('tooltip');
    if(hit){tt.style.display='block';tt.style.left=e.clientX+'px';tt.style.top=e.clientY+'px';tt.textContent=hit.type==='moon'?'🌕 dolunay':'✦ şarkı sözü';mainCanvas.style.cursor='pointer';}
    else{tt.style.display='none';mainCanvas.style.cursor='grab';}
  }
});
window.addEventListener('touchmove',e=>{
  if(!isDragging)return;
  const dx=e.touches[0].clientX-lastMX,dy=e.touches[0].clientY-lastMY;
  if(Math.abs(dx)+Math.abs(dy)>3)dragMoved=true;
  panX=Math.max(-MAX_PAN,Math.min(MAX_PAN,panX-dx));
  panY=Math.max(-MAX_PAN,Math.min(MAX_PAN,panY-dy));
  velX=-dx*0.25;velY=-dy*0.25;
  lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;
},{passive:true});
window.addEventListener('mouseup',e=>{if(!dragMoved){const h=hitTest(e.clientX,e.clientY);if(h)showPopup(h);}isDragging=false;document.body.classList.remove('dragging');});
window.addEventListener('touchend',e=>{if(!dragMoved&&e.changedTouches.length){const t2=e.changedTouches[0];const h=hitTest(t2.clientX,t2.clientY);if(h)showPopup(h);}isDragging=false;});

function showPopup(h){
  const icon=document.getElementById('popup-icon'),text=document.getElementById('popup-text');
  if(h.type==='moon'){icon.textContent='🌕';text.className='popup-text apology';text.innerHTML='Banu hanım (bir tanecik sevgilim),<br><br>o güzel kalbinizi kırdığım için çok özür dilerim. Affınıza mazhar olmak için her şeyi yaparım zira olmazsam günlerim aynı bu gece gibi karanlık olacak.<br><br><em>— Seni canından çok seven sevgilin, Kerem\'in.</em>';}
  else{icon.textContent='✦';text.className='popup-text';text.innerHTML=lyrics[h.i].replace(/\n/g,'<br>');}
  document.getElementById('overlay').classList.add('active');
}
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this||e.target.id==='close-btn')this.classList.remove('active');});

let hintHidden=false;
mainCanvas.addEventListener('mousedown',()=>{if(!hintHidden){setTimeout(()=>{document.getElementById('hint').style.opacity='0';hintHidden=true;},1800);}});

// ========================
// MAIN LOOP
// ========================
let t=0;
function loop(){
  requestAnimationFrame(loop);
  t+=0.016;

  if(!isDragging){
    panX=Math.max(-MAX_PAN,Math.min(MAX_PAN,panX+velX));
    panY=Math.max(-MAX_PAN,Math.min(MAX_PAN,panY+velY));
    velX*=0.91;velY*=0.91;
  }

  ctx.clearRect(0,0,W,H);

  // Draw realistic star layers
  layerStars.forEach(layer=>{
    layer.stars.forEach(s=>{
      s.twinkle+=s.twinkleSpeed;
      const twinkleFactor = 1 - s.twinkleAmp + s.twinkleAmp*Math.sin(s.twinkle);
      const alpha=s.alpha*twinkleFactor;
      const sx=W/2+s.ox-panX*layer.depth;
      const sy=H/2+s.oy-panY*layer.depth;
      if(sx<-20||sx>W+20||sy<-20||sy>H+20)return;

      // Star glow halo for bright stars
      if(s.hasGlow && s.r > 0.7){
        const glowR = s.r*4.5;
        const glow=ctx.createRadialGradient(sx,sy,0,sx,sy,glowR);
        glow.addColorStop(0,`rgba(${s.cr},${s.cg},${s.cb},${(alpha*0.5).toFixed(3)})`);
        glow.addColorStop(1,`rgba(${s.cr},${s.cg},${s.cb},0)`);
        ctx.fillStyle=glow;ctx.beginPath();ctx.arc(sx,sy,glowR,0,Math.PI*2);ctx.fill();
      }

      ctx.beginPath();ctx.arc(sx,sy,s.r*twinkleFactor,0,Math.PI*2);
      ctx.fillStyle=`rgba(${s.cr},${s.cg},${s.cb},${alpha.toFixed(3)})`;
      ctx.fill();
    });
  });

  // Shooting stars
  nextShoot--;
  if(nextShoot<=0){spawnShoot();nextShoot=160+Math.random()*250;}
  for(let i=shoots.length-1;i>=0;i--){
    const s=shoots[i];
    const tail=s.len*s.life;
    const grad=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*tail/s.vx,s.y-s.vy*tail/Math.max(s.vy,0.1));
    grad.addColorStop(0,`rgba(255,255,255,${(s.life*s.bright).toFixed(2)})`);
    grad.addColorStop(0.15,`rgba(220,230,255,${(s.life*0.6).toFixed(2)})`);
    grad.addColorStop(1,'rgba(200,210,255,0)');
    ctx.strokeStyle=grad;ctx.lineWidth=s.width;
    ctx.beginPath();ctx.moveTo(s.x,s.y);
    ctx.lineTo(s.x-s.vx*tail/8,s.y-s.vy*tail/8);
    ctx.stroke();
    s.x+=s.vx;s.y+=s.vy;s.life-=0.015;
    if(s.life<=0||s.y>H+20)shoots.splice(i,1);
  }

  // Interactive stars
  drawMyStars();

  // Render THREE.js moon
  updateMoonPosition();
  moonRenderer.render(moonScene, moonCamera);
}

loop();
</script>
</body>
</html>
